            console.log(cx + (dx - 0), cy + (dy - 0));
            drawAxes(cx + (dx - 0), cy + (dy - 0));

        function rotatePoint(p) {
            let x = p.x * Math.cos(radRoll) - p.y * Math.sin(radRoll);
            let y = p.x * Math.sin(radRoll) + p.y * Math.cos(radRoll);
            let z = p.z;

            let newY = y * Math.cos(radPitch) - z * Math.sin(radPitch);
            let newZ = y * Math.sin(radPitch) + z * Math.cos(radPitch);
            y = newY;
            z = newZ;

            let newX = x * Math.cos(radYaw) - z * Math.sin(radYaw);
            newZ = x * Math.sin(radYaw) + z * Math.cos(radYaw);
            x = newX;
            z = newZ;

            return { x: x, y: y, z: newZ };
        }

        function isFaceFront(points, face) {
            const v1 = {
                x: points[face[1]].x - points[face[0]].x,
                y: points[face[1]].y - points[face[0]].y,
                z: points[face[1]].z - points[face[0]].z
            };
            const v2 = {
                x: points[face[2]].x - points[face[1]].x,
                y: points[face[2]].y - points[face[1]].y,
                z: points[face[2]].z - points[face[1]].z
            };
            const normal = {
                x: v1.y * v2.z - v1.z * v2.y,
                y: v1.z * v2.x - v1.x * v2.z,
                z: v1.x * v2.y - v1.y * v2.x
            };
            return normal.z >= 0;
        }

        function drawAxes(cx, cy) {
            const axes = [
                { x: 50, y: 0, z: 0, color: 'red' },
                { x: 0, y: 50, z: 0, color: 'green' },
                { x: 0, y: 0, z: 50, color: 'blue' }
            ];

            axes.forEach(axis => {
                const rotated = rotatePoint(axis);
                ctx.strokeStyle = axis.color;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(cx + rotated.x, cy + rotated.y);
                ctx.stroke();
            });
        }

        function animate() {
            drawBox();
            requestAnimationFrame(animate);
        }

        function initWebSocket() {
            console.log('Trying to open a WebSocket connection...');
            websocket = new WebSocket(`ws://${location.hostname}:8080/`);
            websocket.onopen = () => console.log('Connection opened');
            websocket.onclose = () => setTimeout(initWebSocket, 200);
            websocket.onmessage = (event) => {
                const rdata = JSON.parse(event.data);
                radRoll = (rdata[0] - 180) * Math.PI / 180;
                radPitch = (rdata[1] - 180) * Math.PI / 180;
                radYaw = (rdata[2]) * Math.PI / 180;
                dx = rdata[3];
                dy = rdata[4];
                // console.log(rdata);
            };
        }

        function onLoad() {
            initWebSocket();
            animate();
        }
    </script>
